# ─────────────────────────────────────────────────────────────────────────────
# 실습 장면 설정 — OMX 판 (robot:=omx). RB5 판은 scene.yaml.  ★ = 현장에서 꼭 확인
#   좌표계 world = 로봇(OMX-F) 바닥면 중심. x = 로봇 정면.  단위 m · 각도 도(deg)
#   이 파일을 고친 뒤에는 launch 를 다시 시작하면 된다(--symlink-install 로 빌드한 경우 빌드 불필요).
# ─────────────────────────────────────────────────────────────────────────────
robot: omx

table:
  top_z: -0.010          # ★ 바닥(테이블) 높이 = 로봇 바닥면 기준. 로봇이 검은 받침판 위에 있으면 −(판 두께)
                         #   ✅ 받침판 두께 1 cm 실측(2026-11-11). 틀리면 집는 높이·인식 위치가 함께 틀린다
  center_xy: [0.20, 0.0] # 테이블 중심(로봇 기준) — 화면 표시·충돌 검사용
  size_xy: [0.60, 0.70]
  thickness: 0.02

# ─── 팔 관절 이름 (pick_place 가 쓴다) ──────────────────────────────────────────
arm_joints: [joint1, joint2, joint3, joint4, joint5]

# ─── 그리퍼 (OMX-F: 두 턱이 축을 중심으로 돌며 벌어진다 · gripper_joint_1 [rad]) ──────
#   손끝 벌림 ≈ 2 × jaw_length × sin(각도)  (STL 메시에서 잰 값: 0.4 rad → 4.8 cm · 0.8 rad → 8.6 cm)
#   ⚠ 턱이 돌며 벌어지므로 열수록 손끝이 뒤로 물러난다 (0 rad 9.45 cm → 0.8 rad 8.13 cm, link5 기준)
gripper:
  type: jaw              # jaw = 회전 턱(각도 = asin(폭 / 2L)) · linear = RG2 처럼 폭에 비례
  joint: gripper_joint_1
  jaw_length: 0.060      # 턱 축 → 손끝 [m]
  joint_open: 0.8        # '열기' 각도 [rad] (≈ 8.6 cm). ROBOTIS 설정의 open = 1.0 rad
  max_open: 0.086        # = 2 × 0.060 × sin(0.8)
  tip_open: 0.0813       # 열었을 때 link5 → 손끝 [m] (= tool_tip 위치)
  tip_closed: 0.0945     # 닫았을 때 link5 → 손끝 [m]
  open_pct: 100
  approach_margin: 0.020 # 다가갈 때는 물체 폭 + 2 cm 만 연다 (최대로 열면 턱이 8.6 cm 로 벌어져 옆 물체를 친다)
  close_squeeze: 0.020  # ★ '잡기' 목표 = 물체 폭 − 이 값. 전류 제한(Goal Current 900 · omx_f.ros2_control.xacro)에서 멈춰 쥔다 · 1 cm·600 mA 는 실기에서 옮기다 흘렸다(11-11) → 2 cm·900 mA
  release_margin: 0.020  # 놓을 때 물체 폭 + 이 값까지만 연다 (1.2 cm 로 줄여도 회전 턱이라 옆 토마토와 겹침이 0.1→1.4 mm 로 오히려 늘었다 · 11-11 가상)
  palm_depth: 0.030      # 손끝 → 턱 안쪽 깊이 [m] — 물체를 이보다 깊게 넣지 않는다
  palm_margin: 0.005
  touch_links: [link5, link6, link7, usb_cam_link]   # 쥔 물체와 닿아도 되는 링크 — usb_cam_link: 카메라 충돌 상자(3×8×3 cm 근사)가 턱 사이 공간까지 내려와 쥔 토마토와 2 cm 겹친다(11-11 실기 · 실제 카메라는 얇은 보드라 안 닿음)
  side_reach: [0.03, 0.065] # 그리퍼 몸통(link5)이 손끝 y축 쪽(카메라 쪽)으로 튀어나온 거리 [m] — 메시 실측 6.6 cm
                            #   손목 방향을 고를 때 이 점들도 주변 물체와 떨어지게 한다 (가상: 옆 토마토 윗부분에 닿았다)
  held_points: 400       # (USB 카메라는 손가락 사이 확인을 하지 않는다)

grasp_rules:             # 물체 치수 → 잡는 법 (scene.yaml 설명 참고)
  round_yaw_avoid: true  # 둥근 물체는 벌린 손끝이 이웃 물체에서 가장 멀어지는 방향으로 닫는다(턱이 길어 옆 물체를 친다)
  low_ratio: 1.3
  tall_ratio: 2.5
  tall_max_insert: 0.010
  lying_length_ratio: 2.5
  lying_height_ratio: 1.5
  lying_max_insert: 0.012
  lying_squeeze: 0.008

# ─── USB 카메라 장착 (OMX AI 키트 카메라 등 일반 웹캠) ────────────────────────────
#   parent: world = 테이블 위에 고정(위에서 내려다봄) / link5 = 손목에 장착
#   카메라 몸체 x축이 보는 방향. pitch 90° = 바로 아래를 본다.
#   ★ 실제 장착 위치를 자로 재서 넣는다. 위치가 1 cm 틀리면 집는 위치도 약 1 cm 틀린다.
camera_mount:
  # ✅ 2026-11-11: OMX-F 메시(follower_06_pan_Revised = link5)의 카메라 브래킷 위치로 옮김 (사용자 지적 — RViz 에서 카메라가 브래킷 밖에 있었다)
  #   브래킷 판 앞면 중심 (0.036, 0, 0.046) · 판 법선 = 앞-아래 36.9° → 렌즈 = 법선 방향 약 1 cm 앞
  #   숙임 36.9° 는 메시 값 그대로 — 실측(지름 5 cm 토마토 2알의 화면 크기)으로 맞춘 값 36.7° 와 일치
  #   🔴 옛 값(11-10 · 토마토 1알 보정)은 브래킷보다 5 cm 뒤·8° 덜 숙임 → 인식이 앞뒤 1~2 cm 멀게·좌우 좁게 나왔다
  #      (옛 값: xyz [-0.0158, 0.0017, 0.0592] · rpy_deg [-0.6, 28.7, 0.3])
  #   ✅ ChArUco 판 보정(11-11 · tools/omx_charuco_calib.py · 로봇 양쪽 클램프 후 9장 · hand-eye PARK):
  #      숙임 38.4° ≈ 메시 브래킷 36.9° · 위치는 메시 추정(0.044, 0, 0.040)보다 2 cm 앞 · 방식 3종(PARK·DANI·TSAI) 차 0.5 cm·1°
  #      검산: 판 로봇쪽 변 정면 11.1 cm ↔ 실측 약 10.5 cm · 판 높이 −0.98 cm ↔ 테이블 −1.0 cm · 사진 간 흩어짐 3~4 mm
  #      ⚠ 판이 로봇 기준 약 6° 기울어 보인다 — 클램프 전후 동일 ⇒ 받침 들림 아님 · 관절 영점/URDF 치수 의심(미규명)
  #         영향: 정면 22 cm 부근 바닥이 모델보다 약 1 cm 높게 보임 (정면 11 cm 부근은 거의 0)
  parent: link5
  xyz: [0.0628, -0.0012, 0.0379]
  rpy_deg: [1.4, 38.4, 0.5]

camera:
  # ★ 웹캠 장치. /dev/videoN 번호는 꽂는 순서에 따라 바뀐다 → 제품 이름이 든 by-id 경로를 쓴다
  #   (ls /dev/v4l/by-id/ · OMX AI 키트 카메라 = Innomaker U20CAM-720P)
  device: /dev/v4l/by-id/usb-Innomaker_Innomaker-U20CAM-720P_SN0001-video-index0
  width: 640
  height: 480
  hfov_deg: 49.5         # ✅ ChArUco 보정 f 694.7 px (11-11 · 24장) — calibration_url 파일이 있으면 그쪽(왜곡 포함)이 우선
                         #   🔴 렌즈 왜곡이 크다(k1 −0.47) — 왜곡을 무시한 옛 값들(34.9°·47°)은 위치마다 다른 답을 냈다
                         #   해상도를 바꾸면 화각도 바뀐다 → 다시 보정
  brightness: 0          # 🔴 usb_cam 은 안 주면 50 을 쓴다 → 흰 테이블이 포화·토마토 채도 36(인식 기준 90) → 검출 0 (11-11 실기)
                         #   0 에서 채도 90~94 · 다른 조명이면 화면(/edu_pick/debug_image)을 보고 조절 (−64~64)
  # 그리퍼 턱이 화면을 가리는 영역 [u, v] (0~1 · 왼쪽 위 0,0) — 그 안의 색은 버리고, 닿은 물체는 '가려짐'으로 집지 않는다
  #   (11-11 실기 화면에서 그림 · 카메라와 그리퍼가 같은 link5 에 붙어 자세와 무관 · 턱을 열든 닫든 이 안에 든다)
  occlusion_polygon: [[0.0, 0.73], [0.14, 0.68], [0.51, 0.45], [0.62, 0.46], [0.94, 0.62], [1.0, 0.70], [1.0, 1.0], [0.0, 1.0]]
  calibration_url: "file:///home/robot/.ros/camera_info/omx_cam.yaml"   # 보정 파일 (tools/omx_charuco_calib.py solve 가 만든 값) — 다른 PC 면 경로를 바꾸거나 ""  (예: file:///home/robot/.ros/camera_info/omx_cam.yaml) — 있으면 화각 대신 사용(왜곡도 편다)

# ─── 실습 시나리오 ────────────────────────────────────────────────────────────
# 관절 자세 [deg] : joint1 … joint5
poses:
  home:    [0.0, -90.0, 90.0, 90.0, 0.0]     # ★ 접어 든 자세 (ROBOTIS home) — 손끝 (0.04, 0, 0.03) m, 아래를 봄
  # ★ 대기위치 — 손목 카메라(화각 35°)를 34 cm 높이로 들고 앞으로 기울여 토마토 놓는 곳 전체를 본다
  #   보는 범위 ≈ x 0.10~0.25 · y −0.10~0.10 m (보정한 카메라 모델로 계산) · 관절 4 는 100° (실기에서 약 105° 에서 막힘)
  observe: [0.0, -20.0, -20.0, 92.0, 0.0]
  # 🔴 손목 카메라 화면 아래쪽 약 절반을 그리퍼 턱이 가린다(열든 닫든 같다 · 2026-11-11 실기) → 한 자세로 2×2 를 다 못 본다
  #   observe      = 뒷줄(x ≈ 0.215) 이 턱 위에 온전히 보이는 자세 (100° 에선 뒷줄이 화면 위 끝에 잘렸다)
  #   observe_near = 앞줄(x ≈ 0.15) 용 — observe 에서 집을 물체가 없을 때만 간다 (카메라 모델로 계산 · 손끝 높이 약 19 cm)
  observe_mid: [0.0, -27.0, -8.0, 96.0, 0.0]     # 정면 약 0.15~0.19 m 용 (11-11 실기: 17.6 cm 토마토가 이 자세에서만 온전히 보였다)
  observe_near: [0.0, -35.0, 5.0, 100.0, 0.0]

# ─── 하역 상자 (갈색 박스) — MoveIt 이 벽을 피해 간다 ──────────────────────────────
#   ✅ 실측(2026-11-11): 로봇 쪽 뒤 모서리 = 1번 축에서 뒤로 4 cm · 오른쪽 9 cm · 바깥 23(앞뒤) × 18(좌우) cm
#      ⇒ x −0.04 ~ 0.19 · y −0.27 ~ −0.09  (로봇 중심 = 1번 모터 축 아래)
box:
  center_xy: [0.075, -0.18]    # 상자 바깥 중심
  outer_size_xy: [0.23, 0.18]  # 바깥 크기 (x 앞뒤 · y 좌우)
  height: 0.06                 # 벽 높이 (사용자: 약 6 cm)
  plan_margin_z: 0.03          # 계획에서만 벽을 3 cm 더 높게 본다 — 팔이 처져 계획보다 낮게 지나가 상자를 밀었다(11-11 실기)
  wall: 0.005

place:
  # 상자 안 칸 — 토마토(지름 약 5 cm) 사이 7 cm. 로봇에서 0.23 m 를 넘으면 벽 위로 넘어갈 높이에서 손이 닿지 않는다
  #   상자 안쪽 x −0.035~0.185 · y −0.265~−0.095 · 칸 사이 앞뒤 7.8 · 좌우 7 cm
  #   (11-11 가상: 좌우 6 cm → 4번째 놓기 하강 79% · 앞뒤 7 cm → 4번째 칸에서 연 턱 몸통이 앞 칸 토마토 옆면에 닿아 상승 0%)
  #   토마토(반지름 2.9) 가장자리 ↔ 벽: 뒤 1.8 · 바깥 2.6 · 로봇 쪽 1.6 cm · 가장 먼 칸 0.228 m
  slots: [[0.09, -0.21], [0.012, -0.21], [0.09, -0.14], [0.012, -0.14]]
  yaw_deg: 0.0
  keep_out: 0.04
  earlier_size: [0.055, 0.055]   # --first-slot 로 건너뛴 칸에 이미 있다고 볼 물체(지름·높이) = 토마토

motion:
  obstacle_pad: 0.003     # 인식한 물체를 장애물로 넣을 때 여유 (RB5 기본 1 cm — 토마토가 2 cm 간격이라 줄였다)
  approach_height: 0.05   # 집을 때: 물체 위 5 cm 에서 수직으로 내려간다 (멀리 있는 토마토는 7 cm 위에서 손이 안 닿았다)
  place_approach_height: 0.07   # 놓을 때: 7 cm 위에서 내려가고 놓은 뒤 여기까지 올라온다 (상자 벽 6 cm · 5 cm 는 실기에서 놓은 물체와 턱이 닿은 채로 보였다)
  grip_depth: 0.015
  min_tip_clearance: 0.005
  release_gap: 0.005
  release_gap_tall: 0.008
  check_lift: 0.02
  linear_speed: 0.08      # 11-11: 2배(사용자 — 느려서 팔이 덜덜거렸다)
  linear_joint_max: 1.0
  velocity_scaling: 0.30   # 11-11: 0.15 → 0.30(사용자 요청 2배). 11-10 엔 0.30 에서 추종 지연 0.15 rad 로 중단됐으나 경로 허용오차를 0.25(joint5 0.5)로 넓힌 뒤 재시도

detection:
  method: color          # color = USB 카메라 색 인식 (깊이 없음) · depth = D405 점군
  roi_x: [0.10, 0.25]    # ★ 인식할 바닥 영역 — 대기위치에서 카메라가 보는 범위 · 위에서 수직으로 집을 수 있는 범위 안
  roi_y: [-0.09, 0.09]
  min_area: 0.0002       # 위에서 본 면적 [m²] — 이보다 작은 덩어리는 잡음 (≈ 1.4 × 1.4 cm)
  min_width: 0.010
  max_grip_width: 0.080
  max_reach: 0.23        # ★ 로봇 중심에서 이보다 먼 물체는 집지 않는다
                         #   (가상 모드 IK 측정: 위에서 수직 집기는 손끝 높이 1.5~5 cm 에서 0.26 m,
                         #    8 cm 에서 0.24 m 까지 — 직선 하강이 끝까지 되도록 여유를 둔다)
  # 물체 색 (HSV · OpenCV 범위 H 0~179, S·V 0~255) 과 높이.
  #   🔴 카메라 하나로는 높이를 잴 수 없다 → 색마다 물체 높이를 정해 준다(그 높이의 윗면에 있다고 보고 위치를 계산)
  #   height: sphere = 공 모양(토마토) — 위에서 보이는 윤곽은 지름의 절반 높이에 있다 → 폭(지름)에서 높이를 구한다
  colors:
    - {name: red,    hsv: [[0, 90, 70], [10, 255, 255]], hsv2: [[165, 90, 70], [179, 255, 255]], height: sphere}   # 토마토(공 모양)
    - {name: green,  hsv: [[40, 80, 50], [85, 255, 255]],   height: 0.030}
    - {name: blue,   hsv: [[95, 120, 50], [130, 255, 255]], height: 0.030}
    - {name: yellow, hsv: [[20, 100, 100], [35, 255, 255]], height: 0.030}

# ─── 가상 물체 (mode:=sim) — color 는 위 detection.colors 의 이름 ───────────────────
sim_objects:              # 실습 배치: 토마토 4알 (지름 약 5 cm) — 사진(2026-11-10)과 비슷하게
  - {id: tomato_1, shape: round, color: red, xy: [0.15, 0.035],  size: [0.052, 0.052]}
  - {id: tomato_2, shape: round, color: red, xy: [0.15, -0.035], size: [0.052, 0.052]}
  - {id: tomato_3, shape: round, color: red, xy: [0.215, 0.035], size: [0.052, 0.052]}
  - {id: tomato_4, shape: round, color: red, xy: [0.215, -0.035], size: [0.052, 0.052]}
