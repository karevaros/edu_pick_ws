# ─────────────────────────────────────────────────────────────────────────────
# 실습 장면 설정 — 강사가 실습실에 맞게 고치는 파일 (★ 표시 = 현장에서 꼭 확인)
#   좌표계 world = 로봇 베이스(link0) 바닥면 중심.  x·y·z 단위 m, 각도 단위 도(deg)
#   이 파일을 고친 뒤에는 다시 빌드할 필요 없음(--symlink-install 로 빌드한 경우).
# ─────────────────────────────────────────────────────────────────────────────

table:
  # ★ 테이블 윗면 높이 = 로봇 베이스 바닥면 기준. 로봇이 테이블에 바로 놓이면 0,
  #   받침 위에 있으면 -(받침 두께).  실습실 실측: 받침 8.5 cm → -0.085 (2026-11-03)
  top_z: -0.085
  center_xy: [0.35, 0.0] # 테이블 중심(로봇 기준)  — 화면 표시·충돌 검사용
  size_xy: [1.0, 1.2]    # 테이블 가로·세로
  thickness: 0.04

# 로봇 받침 (테이블과 로봇 베이스 사이) — 충돌 검사용. 높이는 table.top_z 에서 자동
robot_stand:
  size_xy: [0.80, 0.80]  # 받침 가로·세로 — 실측 80 × 80 × 8.5 cm, 로봇이 한가운데 (2026-11-03)

# ─── 그리퍼 RG2 (실측값 · 툴 플랜지 면 → 손가락 끝, 그리퍼 축 방향) ───────────────
#   ⚠ RG2 는 닫을수록 손끝이 앞으로 나온다: 최대 벌림 10 cm 일 때 20.5 cm · 완전히 닫으면 24 cm
#     메시 모델은 이 차이를 1 cm 정도로만 표현한다 → 집는 높이 계산은 아래 실측값을 쓴다
#   🔴 RG2 안쪽(손끝에서 약 3 cm)에는 물체가 닿으면 그리퍼가 동작을 멈추는 스위치가 있다
gripper:
  max_open: 0.10         # 최대 벌림 [m] (100 %)
  tip_open: 0.205        # 최대로 벌렸을 때 플랜지 → 손끝 [m]  (= tool_tip 위치. 접근은 항상 열고 한다)
  tip_closed: 0.240      # 완전히 닫았을 때 플랜지 → 손끝 [m]
  flange_x_offset: 0.010 # ★ 손가락 중심 보정 [m] — 툴 플랜지 +X(손가락이 닫히는 방향)로 이만큼
  flange_z_offset: 0.005 # ★ 손가락 중심 보정 [m] — 툴 플랜지 +Z(카메라 쪽, 닫힘 방향과 직각)로 이만큼
                         #   두 값은 실기에서 손가락이 물체 중심에 오는지 눈으로 보고 맞춘 값
  open_pct: 100          # '열기' 벌림 [%]
  close_squeeze: 0.030   # ★ '잡기' 목표 = 인식한 물체 폭 − 이 값 [m]. RG2 는 물체에 닿으면 설정한 힘으로 멈춰 쥔다
                         #   너무 작으면 페트병처럼 눌리는 물체에서 목표에 금방 닿아 힘이 빠진다
  release_margin: 0.030  # 놓을 때는 물체 폭 + 이 값까지만 연다 (최대로 열면 손가락이 옆 칸 물체를 친다)
  force_pct: 60          # 쥐는 힘 [%]
  # 명령 뒤 대기 = settle_base + 손가락 이동 거리 / speed_mps  (RG2 는 도착했다고 알려 주지 않는다)
  settle_base: 0.4       # [s]
  speed_mps: 0.08        # ★ 손가락 속도 가정값 [m/s] — 잡기 전에 팔이 움직이면 낮출 것 (0 = 항상 settle_sec)
  settle_sec: 2.5        # speed_mps 가 0 일 때의 고정 대기 [s]
  palm_depth: 0.030      # ★ 손가락 끝(최대 벌림) → 안쪽 스위치 [m]
  palm_margin: 0.005     #   스위치와 물체 윗면 사이 여유 → 윗면 아래 최대 2.5 cm 까지만 넣는다
  held_points: 400       # 놓은 뒤 손가락 사이에 보이는 점이 이보다 많으면 '아직 손에 있음'

# ─── 물체별 잡는 법 (pick_place 의 classify() 가 쓴다) ───────────────────────────
#   물체 이름은 모른다. 카메라로 잰 치수(폭 w · 길이 l · 높이 h)만으로 가른다.
grasp_rules:
  low_ratio: 1.3         # h < w × 1.3 → '낮은 물체'(사과·공·납작한 박스): 가운데 높이에서 잡는다
  tall_ratio: 2.5        # h ≥ w × 2.5 → '키 큰 물체'(세운 병): 윗면 위에서 닫아 윗부분만 잡는다
  tall_max_insert: -0.015 # 키 큰 물체를 넣는 깊이 [m]. 음수 = 윗면보다 1.5 cm 위에서 닫는다
                         #   (닫히며 손끝이 내려와 뚜껑 윗부분을 쥔다 → 뚜껑이 안쪽 스위치에서 멀다)
  lying_length_ratio: 2.5 # 박스 · l ≥ w × 2.5 · h ≤ w × 1.5 → '누운 병'(눌리는 물체): 얕게 · 덜 조여 잡는다
  lying_height_ratio: 1.5 #   (세게 조이면 병이 찌그러져 부풀고 안쪽 스위치를 누른다)
  lying_max_insert: 0.012 #   손 안으로 들어가는 깊이 [m]
  lying_squeeze: 0.020    #   잡기 목표 = 폭 − 이 값 [m]

# 손목 카메라(D405) 장착 위치 — 툴 플랜지 기준(축 방향은 그리퍼 몸체와 같음 · x = 접근 방향) 실측값(2026-10-29)
#   카메라 브래킷이 플랜지 쪽에 붙어 있어 어댑터 길이와 무관하다 (2026-11-03: 카메라로 잰 테이블 높이로 확인)
camera_mount:
  xyz: [0.0212, 0.0, 0.075]
  rpy_deg: [0.0, 0.0, 0.0]


# ─── 실습 시나리오 설정 (pick_place 노드가 읽는다) ─────────────────────────────
# 관절 자세 [deg] : base, shoulder, elbow, wrist1, wrist2, wrist3
poses:
  # ★ 초기위치 — 팔을 접어 든 자세 (손끝 ≈ (0.24, -0.11, 0.40) m, 아래를 봄)
  home:    [0.0, -30.0, 90.0, 30.0, 90.0, 0.0]
  # ★ 대기위치 — 카메라가 받침대 밖 테이블 작업 영역을 수직으로 내려다봄 (2026-11-03 실습실 배치로 재계산)
  #   손끝 (0.525, 0, 0.165) m = 테이블 위 25 cm · 카메라 (0.60, 0, 0.349) m = 테이블 위 약 43 cm
  #   (D405 는 50 cm 를 넘으면 깊이 오차가 커진다 · 페트병 20 cm 위로 손끝 여유 약 5 cm)
  #   ※ shoulder + elbow + wrist1 = 90° 이면 손끝이 정확히 아래를 본다
  observe: [12.2, 2.9, 100.7, -13.6, 90.0, -12.2]

place:                     # ★ 하역 위치 (테이블 위 xy) — 받침대(로봇 중심 ±0.40 m) 밖, 손이 닿는 곳
  xy: [0.50, -0.33]        #   첫 번째 물체를 놓을 곳
  step_xy: [0.12, 0.0]     #   두 번째부터는 이만큼씩 옆에 놓는다 → (0.62, -0.33), (0.74, -0.33)
  yaw_deg: 0.0             # ★ 박스형을 놓을 때 그리퍼 닫힘 방향(0 = 로봇 정면 x) → 긴 축이 y 로 눕는다
                           #   (긴 축이 x 면 받침대 쪽으로 튀어나와 받침대에 걸린다)
  keep_out: 0.08           #   하역 위치 반경 이내의 물체는 '이미 옮긴 것'으로 보고 인식에서 뺀다

motion:
  approach_height: 0.10    # 물체(또는 하역 위치) 위 몇 m 에서 수직 하강을 시작할지
  grip_depth: 0.025        # 손끝을 물체 윗면보다 이만큼 아래로 내려 잡는다
  min_tip_clearance: 0.010 # 손끝이 테이블에 이보다 가까이 가지 않는다
  release_gap: 0.010       # 놓을 때 물체 바닥을 테이블에서 이만큼 띄운다
  release_gap_tall: 0.015  # 키 큰 물체는 조금 높이서 놓는다 (너무 높으면 넘어진다)
  check_lift: 0.03         # 놓은 뒤 이만큼 들고 손가락 사이를 본다 (손 안 깊이 최대 2.5 cm 보다 커야 한다)
  linear_speed: 0.06       # 수직 하강·상승 평균 속도 [m/s]
  linear_joint_max: 0.6    # 직선 이동 중 관절 속도 상한 [rad/s]
  velocity_scaling: 0.20   # 관절 이동 속도 배율 (최대속도 3.14 rad/s 의 비율 → 0.63 rad/s)
                           #   ⚠ launch 의 max_joint_velocity(하드웨어 상한, 기본 0.8)보다 낮아야 한다

detection:
  # 인식할 테이블 영역 (이 밖의 점은 무시). ★ 대기위치에서 카메라가 실제로 보는 범위 안,
  #   받침대(x < 0.40)는 빼야 한다 — 받침대 윗면(8.5 cm 높이)이 섞이면 테이블 면 추정이 흔들린다
  #   대기위치(카메라 높이 ≈ 0.43 m)의 D405 시야 ≈ x 0.36~0.84 · y -0.41~0.41 m
  #   위에서 수직으로 집을 수 있는 범위(IK 확인) ≈ x 0.45~0.70 · y -0.45~0.45 m
  roi_x: [0.45, 0.78]
  roi_y: [-0.22, 0.30]
  min_height: 0.015        # 테이블보다 이만큼 높으면 '물체'
  max_height: 0.35
  min_width: 0.015         # 이보다 가는 덩어리(로봇 케이블 등)는 버린다
  min_area: 0.0006         # 이보다 작은 덩어리(위에서 본 면적 m²)는 잡음으로 버린다 (≈ 2.5 cm × 2.5 cm)
  auto_table: true         # 테이블 높이를 깊이 영상에서 다시 추정 (false = table.top_z 그대로)
  max_grip_width: 0.095    # '열기' 벌림(100 % = 10 cm)에서 여유 5 mm 를 뺀 값 — 이보다 넓으면 집지 않는다

# ─── 가상 물체 (mode:=sim 에서만 사용 — 카메라 없이 연습) ──────────────────────
#   shape: box  → size: [가로, 세로, 높이]  yaw_deg: 회전
#   shape: round→ size: [지름, 높이]
sim_objects:                # 실습실 물체와 비슷하게: 사과 모형 · 누운 페트병 · 작은 둥근 물체 (+ 너무 큰 박스)
  #   ⚠ 뚜껑 달린 '세운 병'은 상자·원기둥만으로 못 그린다(가상 모드 한계)
  - {id: apple,   shape: round, xy: [0.56, 0.08],   size: [0.075, 0.07]}
  - {id: bottle,  shape: box,   xy: [0.63, -0.10],  yaw_deg: 40, size: [0.065, 0.18, 0.065]}   # 누운 페트병
  - {id: small,   shape: round, xy: [0.49, -0.12],  size: [0.042, 0.042]}
  - {id: big_box, shape: box,   xy: [0.66, 0.22],   yaw_deg: 0,  size: [0.12, 0.12, 0.08]}    # 너무 커서 못 집는 물체
