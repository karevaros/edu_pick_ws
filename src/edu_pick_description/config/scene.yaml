# ─────────────────────────────────────────────────────────────────────────────
# 실습 장면 설정 — 강사가 실습실에 맞게 고치는 파일 (★ 표시 = 현장에서 꼭 확인)
#   좌표계 world = 로봇 베이스(link0) 바닥면 중심.  x·y·z 단위 m, 각도 단위 도(deg)
#   이 파일을 고친 뒤에는 다시 빌드할 필요 없음(--symlink-install 로 빌드한 경우).
# ─────────────────────────────────────────────────────────────────────────────

table:
  top_z: 0.0             # ★ 테이블 윗면 높이 (로봇이 테이블 위에 직접 고정돼 있으면 0)
  center_xy: [0.35, 0.0] # 테이블 중심(로봇 기준)  — 화면 표시·충돌 검사용
  size_xy: [1.0, 1.2]    # 테이블 가로·세로
  thickness: 0.04

# 손목 카메라(D405) 장착 위치 — 그리퍼 몸체(rg2_hand) 기준 실측값(2026-10-29)
camera_mount:
  xyz: [0.0212, 0.0, 0.075]
  rpy_deg: [0.0, 0.0, 0.0]

# 집기 기준점(tool_tip) — 그리퍼 손끝. rg2_hand 원점에서 접근 방향으로 이만큼 앞.
#   (메시 실측: 완전히 닫았을 때 0.2125 m · 100% 열었을 때 0.203 m → 그 사이 값)
tool_tip_offset: 0.205

# ─── 실습 시나리오 설정 (pick_place 노드가 읽는다) ─────────────────────────────
# 관절 자세 [deg] : base, shoulder, elbow, wrist1, wrist2, wrist3
poses:
  # ★ 초기위치 — 팔을 접어 든 자세 (손끝 ≈ (0.24, -0.11, 0.43) m, 아래를 봄)
  home:    [0.0, -30.0, 90.0, 30.0, 90.0, 0.0]
  # ★ 대기위치 — 손끝 (0.40, 0.00, 0.22) m 에서 수직으로 내려다봄 → 카메라는 테이블 위 약 0.40 m
  #   (D405 는 7~50 cm 에서 정확하다. 더 높이 올리면 깊이 오차가 커진다)
  #   ※ shoulder + elbow + wrist1 = 90° 이면 손끝이 정확히 아래를 본다
  observe: [16.1, -15.6, 113.9, -8.3, 90.0, -16.1]

place:                     # ★ 하역 위치 (테이블 위 xy)
  xy: [0.30, -0.35]        #   첫 번째 물체를 놓을 곳
  step_xy: [0.10, 0.0]     #   두 번째부터는 이만큼씩 옆에 놓는다 (같은 자리에 겹쳐 놓지 않게)
  keep_out: 0.08           #   하역 위치 반경 이내의 물체는 '이미 옮긴 것'으로 보고 인식에서 뺀다

motion:
  approach_height: 0.10    # 물체(또는 하역 위치) 위 몇 m 에서 수직 하강을 시작할지
  grip_depth: 0.025        # 손끝을 물체 윗면보다 이만큼 아래로 내려 잡는다
  min_tip_clearance: 0.010 # 손끝이 테이블에 이보다 가까이 가지 않는다
  release_gap: 0.010       # 놓을 때 물체 바닥을 테이블에서 이만큼 띄운다
  linear_speed: 0.04       # 수직 하강·상승 평균 속도 [m/s]
  velocity_scaling: 0.12   # 관절 이동 속도 배율 (최대속도 3.14 rad/s 의 비율)

detection:
  # 인식할 테이블 영역 (이 밖의 점은 무시). ★ 대기위치에서 카메라가 실제로 보는 범위 안에 둘 것
  #   대기위치(카메라 높이 ≈ 0.40 m)의 D405 시야 ≈ x 0.26~0.69 · y -0.38~0.38 m
  roi_x: [0.27, 0.68]
  roi_y: [-0.36, 0.36]
  min_height: 0.015        # 테이블보다 이만큼 높으면 '물체'
  max_height: 0.35
  min_area: 0.0006         # 이보다 작은 덩어리(위에서 본 면적 m²)는 잡음으로 버린다 (≈ 2.5 cm × 2.5 cm)
  auto_table: true         # 테이블 높이를 깊이 영상에서 다시 추정 (false = table.top_z 그대로)
  max_grip_width: 0.095    # RG2 최대 벌림(약 110 mm)에서 여유를 뺀 값 — 이보다 넓으면 집지 않는다

# ─── 가상 물체 (mode:=sim 에서만 사용 — 카메라 없이 연습) ──────────────────────
#   shape: box  → size: [가로, 세로, 높이]  yaw_deg: 회전
#   shape: round→ size: [지름, 높이]
sim_objects:
  - {id: box_1, shape: box,   xy: [0.40, 0.10],  yaw_deg: 30, size: [0.06, 0.09, 0.05]}
  - {id: can_1, shape: round, xy: [0.48, -0.08], size: [0.066, 0.12]}
  - {id: big_box, shape: box, xy: [0.36, 0.26],  yaw_deg: 0,  size: [0.15, 0.15, 0.08]}    # 너무 커서 못 집는 물체
